# Conda environment for the PREFIRE_AUX_MET bundle (conda-forge only). Checked on 2026-10-27 on x86-64 Linux.
# The package list is the one in PREFIRE_AUX_MET/README.md, unpinned: the pinned versions in
# PREFIRE_AUX_MET/conda_env.list (esmf 8.4.2, h5py 3.10, netcdf4 1.6.5 with python 3.10) no longer solve together
# on conda-forge. The unpinned list gave numpy 2.2, scipy 1.15, netcdf4 1.7.4, h5py 3.16 and esmf/esmpy 8.9.1,
# which reproduce the official R01 product wherever the inputs agree.
# Left out on purpose: mpi4py and pyhdf, which that README also lists. Nothing on the run path imports either
# (the cubed-sphere step gets its MPI rank from esmpy, and pyhdf is used only by PREFIRE_sim_tools/datasim).
name: prefire_aux_met
channels:
  - conda-forge
dependencies:
  - python=3.10        # the version PREFIRE_AUX_MET/README.md asks for
  - numpy
  - scipy
  - netcdf4
  - h5py
  - esmpy
  - esmf=*=mpi_mpich*  # the MPICH build of ESMF, as in conda_env.list; the cubed-sphere (operational) mode needs it
  - mpich              # provides the mpirun that interp_ESMF.py starts (mpirun -n 6) in cubed-sphere mode
  - cartopy            # reads the BAS Antarctic coastline shapefiles
  - shapely
  - git                # determine_prdgit.py records the code versions in the product
  - unzip              # unpacks the Zenodo ancillary data
